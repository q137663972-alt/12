name: Build Android APK (TV + Phone)

on:
  push:
    paths:
      - 'android-app/**'
      - 'android-phone/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: android-app
            artifact: EnglishPlaygroundTV-apk
          - project: android-phone
            artifact: EnglishPlaygroundPhone-apk
    name: Build ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # runner 已预装 Android SDK（$ANDROID_HOME 含 API34 / build-tools 34.0.0），
      # 无需第三方 setup-android（近期不稳定，曾导致构建在 16s 内失败）

      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true'

      - name: Install SDK platform & build-tools (API 34)
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'

      - name: Download Gradle 8.2 (wrapper jar missing in repo)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d "$HOME/gradle_dist"
          echo "$HOME/gradle_dist/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Build debug APK (auto-signed, installable)
        working-directory: ${{ matrix.project }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/*.apk

  # 把两个 APK 发布到固定 Release（apk-latest），生成免登录、免解压的公开直链
  release:
    name: Publish APKs to Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: EnglishPlayground*-apk

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp apks/EnglishPlaygroundTV-apk/app-debug.apk    dist/EnglishPlayground-TV.apk
          cp apks/EnglishPlaygroundPhone-apk/app-debug.apk dist/EnglishPlayground-Phone.apk
          ls -la dist

      - name: Publish to Release (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 英语乐园 APK · 自动构建 #${{ github.run_number }}
          body: |
            每次推送自动构建，本 Release 始终指向**最新**构建产物。

            - `EnglishPlayground-TV.apk` — 电视 / 机顶盒版（遥控器模式，横屏）
            - `EnglishPlayground-Phone.apk` — 安卓手机版（原版 H5 竖屏样式）

            两个包 debug 自动签名，安装时需在设备上允许「未知来源」（仅首次）。
            包名不同（手机版带 `.phone` 后缀），可同时安装。

            来源 commit：${{ github.sha }}
          files: |
            dist/EnglishPlayground-TV.apk
            dist/EnglishPlayground-Phone.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
