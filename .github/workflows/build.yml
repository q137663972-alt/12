name: Build Android APK (TV + Phone)

on:
  push:
    paths:
      - 'android-app/**'
      - 'android-phone/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 失败时把构建日志提交回仓库，便于诊断
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: android-app
            artifact: EnglishPlaygroundTV-apk
          - project: android-phone
            artifact: EnglishPlaygroundPhone-apk
    name: Build ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # runner 已预装 Android SDK（$ANDROID_HOME 含 API34 / build-tools 34.0.0），
      # 无需第三方 setup-android（近期不稳定，曾导致构建在 16s 内失败）

      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true'

      - name: Install SDK platform & build-tools (API 34)
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'

      - name: Download Gradle 8.2 (wrapper jar missing in repo)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d "$HOME/gradle_dist"
          echo "$HOME/gradle_dist/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Diagnostics (env / SDK / gradle)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms:"; ls "$ANDROID_HOME/platforms" 2>&1
          echo "--- build-tools:"; ls "$ANDROID_HOME/build-tools" 2>&1
          echo "--- gradle:"; gradle -v 2>&1 | head -12

      - name: Build debug APK (auto-signed, installable)
        working-directory: ${{ matrix.project }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Commit build log back to repo (diagnostics)
        if: failure()
        run: |
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/build.log" "ci-logs/${{ matrix.project }}.log"
          cd ci-logs && echo "--- env ---" > "${{ matrix.project }}.env.txt"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "${{ matrix.project }}.env.txt"
          ls "$ANDROID_HOME/platforms" >> "${{ matrix.project }}.env.txt" 2>&1
          ls "$ANDROID_HOME/build-tools" >> "${{ matrix.project }}.env.txt" 2>&1
          which gradle >> "${{ matrix.project }}.env.txt" 2>&1
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci: build log for diagnostics (${{ matrix.project }})" || exit 0
          git push origin HEAD:main

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-buildlog
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/*.apk
