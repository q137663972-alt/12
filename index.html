<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>英语乐园 · 小学1-4年级</title>
<style>
  :root{
    --bg1:#fdf3e7; --bg2:#e3f6fb; --card:#ffffff; --ink:#3a3a4a; --sub:#8a8a9a;
    --pink:#ff8fa3; --blue:#5ec8e0; --yellow:#ffd166; --green:#7ed957; --purple:#b69cff;
    --shadow:0 8px 22px rgba(80,90,140,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
    color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));
    min-height:100vh;display:flex;justify-content:center;
  }
  #app{width:100%;max-width:520px;min-height:100vh;padding:14px 14px 28px;position:relative}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .topbar .back,.topbar .gear{
    width:42px;height:42px;border:none;border-radius:14px;background:#fff;box-shadow:var(--shadow);
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .topbar .title{flex:1;text-align:center;font-weight:800;font-size:18px}
  .topbar .spacer{width:42px;flex:0 0 auto}
  .hero{text-align:center;padding:26px 10px 10px}
  .mascot{font-size:74px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero h1{font-size:30px;margin:8px 0 4px;background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--sub);margin:4px 0 18px;font-size:14px}
  .stars-total{display:inline-flex;align-items:center;gap:6px;background:#fff;padding:6px 14px;border-radius:999px;box-shadow:var(--shadow);font-weight:700;font-size:14px}
  .btn{
    border:none;border-radius:18px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:var(--shadow);width:100%;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn.pink{background:linear-gradient(135deg,var(--pink),#ff6f91)}
  .btn.green{background:linear-gradient(135deg,var(--green),#3fc26b)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .grade-card{background:var(--card);border-radius:22px;padding:18px 12px;box-shadow:var(--shadow);text-align:center;cursor:pointer;border:3px solid transparent;transition:transform .1s}
  .grade-card:active{transform:scale(.97)}
  .grade-card .g-emoji{font-size:46px}
  .grade-card .g-name{font-weight:800;font-size:18px;margin-top:6px}
  .grade-card .g-stars{color:var(--yellow);font-size:14px;margin-top:4px;font-weight:700}
  .sec-title{font-size:16px;font-weight:800;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
  .book-label{margin:14px 4px 6px;font-weight:800;color:var(--purple);font-size:15px}
  .unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .unit-card{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);cursor:pointer;position:relative;min-height:78px;display:flex;flex-direction:column;justify-content:center;transition:transform .1s}
  .unit-card:active{transform:scale(.97)}
  .unit-card.locked{opacity:.55;filter:grayscale(.4)}
  .unit-card .u-name{font-weight:700;font-size:14px;line-height:1.25}
  .unit-card .u-stars{margin-top:6px;font-size:14px;letter-spacing:1px}
  .unit-card .lock{position:absolute;top:10px;right:12px;font-size:16px}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
  .mode-card{background:var(--card);border-radius:22px;padding:18px 12px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform .1s}
  .mode-card:active{transform:scale(.97)}
  .mode-card .m-icon{font-size:44px}
  .mode-card .m-name{font-weight:800;font-size:16px;margin-top:6px}
  .mode-card .m-desc{color:var(--sub);font-size:12px;margin-top:4px;line-height:1.3}
  /* game */
  .game-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .progress-pill{background:#fff;box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
  .replay{width:46px;height:46px;border:none;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:22px;cursor:pointer}
  .big-emoji{font-size:96px;text-align:center;margin:6px 0 4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.08))}
  .big-word{text-align:center;font-size:40px;font-weight:800;letter-spacing:1px;margin:6px 0}
  .prompt{text-align:center;color:var(--sub);font-size:15px;margin-bottom:12px}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{background:var(--card);border-radius:18px;padding:16px 8px;box-shadow:var(--shadow);text-align:center;cursor:pointer;border:3px solid transparent;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:22px;font-weight:700;transition:transform .08s}
  .opt:active{transform:scale(.96)}
  .opt .opt-zh{font-size:12px;color:var(--sub);font-weight:600}
  .opt.correct{border-color:var(--green);background:#eafbe7}
  .opt.wrong{border-color:var(--pink);background:#ffeef1;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .feedback{text-align:center;font-size:16px;font-weight:800;min-height:24px;margin-top:10px}
  .feedback.ok{color:#3fc26b}.feedback.no{color:#ff6f91}
  /* spelling */
  .answer-box{min-height:56px;background:#fff;border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:8px;margin:6px 0 14px;font-size:26px;font-weight:800;letter-spacing:2px}
  .tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .tile{width:46px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
  .tile:active{transform:scale(.92)}
  .tile.used{visibility:hidden}
  /* memory */
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .mem-card{aspect-ratio:1/1;background:linear-gradient(135deg,var(--yellow),#ffb347);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;box-shadow:var(--shadow);user-select:none;transition:transform .1s}
  .mem-card:active{transform:scale(.95)}
  .mem-card.flipped{background:#fff}
  .mem-card.matched{background:#eafbe7;opacity:.7;pointer-events:none}
  .mem-card .face{display:none}
  .mem-card.flipped .face,.mem-card.matched .face{display:flex}
  .mem-card .back{font-size:26px}
  .mem-card.flipped .back,.mem-card.matched .back{display:none}
  /* read */
  .read-score{font-size:54px;font-weight:800;text-align:center;margin:4px 0}
  .mic-btn{width:96px;height:96px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--pink),#ff6f91);color:#fff;font-size:42px;cursor:pointer;box-shadow:var(--shadow);display:block;margin:14px auto}
  .mic-btn.listening{background:linear-gradient(135deg,var(--green),#3fc26b);animation:flash .6s infinite}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.6}}
  .read-hint{text-align:center;color:var(--sub);font-size:14px;min-height:20px}
  /* result */
  .result-stars{font-size:56px;text-align:center;letter-spacing:6px;margin:10px 0}
  .result-box{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:24px 18px;text-align:center;margin-top:10px}
  .row{display:flex;gap:12px;margin-top:16px}
  .row .btn{flex:1}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(40,40,60,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.hidden{display:none}
  .modal-card{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:360px;box-shadow:var(--shadow)}
  .modal-card h3{margin:0 0 14px;text-align:center}
  .set-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
  .set-row label{font-weight:700}
  .switch{width:52px;height:30px;border-radius:999px;background:#ccc;position:relative;cursor:pointer;transition:background .2s}
  .switch.on{background:var(--green)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  .switch.on::after{left:25px}
  input[type=range]{width:150px}
  .toast{position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.8);background:rgba(40,40,60,.9);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.2s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) scale(1)}
  .hidden{display:none!important}
  .foot{text-align:center;color:var(--sub);font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div id="app"></div>
<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h3>⚙️ 设置</h3>
    <div class="set-row"><label>🔊 英语发音</label><div id="ttsSwitch" class="switch on"></div></div>
    <div class="set-row"><label>语速</label><input id="rateRange" type="range" min="0.5" max="1.2" step="0.05" value="0.9"></div>
    <div class="set-row"><label>试听</label><button class="btn ghost" style="width:auto;padding:8px 16px" onclick="speak('Hello, welcome to English乐园!')">🔊 播放</button></div>
    <button class="btn pink" style="margin-top:8px" onclick="closeSettings()">完成</button>
  </div>
</div>
<div id="toast" class="toast"></div>

let settings = JSON.parse(localStorage.getItem("el_settings")||'{"tts":true,"rate":0.9}');
let progress = JSON.parse(localStorage.getItem("el_progress")||'{}');

function saveSettings(){ localStorage.setItem("el_settings", JSON.stringify(settings)); }
function saveProgress(){ localStorage.setItem("el_progress", JSON.stringify(progress)); }
function uKey(gi,bi,ui){ return gi+"-"+bi+"-"+ui; }
function getStars(gi,bi,ui){ return progress[uKey(gi,bi,ui)]||0; }
function setStars(gi,bi,ui,n){ const k=uKey(gi,bi,ui); if((progress[k]||0)<n){progress[k]=n;saveProgress();} }
function isUnlocked(gi,bi,ui){ if(ui===0) return true; return getStars(gi,bi,ui-1)>=1; }
function gradeStars(gi){ let s=0; DATA.grades[gi].books.forEach((b,bi)=>b.u.forEach((u,ui)=>s+=getStars(gi,bi,ui))); return s; }
function totalStars(){ let s=0; DATA.grades.forEach((g,gi)=>g.books.forEach((b,bi)=>b.u.forEach((u,ui)=>s+=getStars(gi,bi,ui)))); return s; }

/* ===================== TTS 引擎 ===================== */
let voiceReady=false;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'))||vs[0]||null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=()=>{voiceReady=true;};
}
function speak(text, lang){
  if(!settings.tts || !('speechSynthesis' in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'en-US'; u.rate=settings.rate; u.pitch=1;
    const v=pickVoice(); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===================== 工具 ===================== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.from((r||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1100); }
function stars(n){ return "⭐".repeat(n)+"☆".repeat(3-n); }

function finishGame(correct, total, modeName){
  const acc = total? Math.round(correct/total*100):0;

}
function nextUnit(){
  const g=DATA.grades[state.gi];
  if(state.ui < g.books[state.bi].u.length-1) return {bi:state.bi, ui:state.ui+1};
  if(state.bi < g.books.length-1) return {bi:state.bi+1, ui:0};

}
function gotoUnit(bi,ui){ state.bi=bi; state.ui=ui; state.view="modes"; render(); }

/* ===================== 1. 听音选图 ===================== */
function startGame(mode){
  state.mode=mode;
  if(mode==="listen") return startListen();
  if(mode==="picture") return startPicture();
  if(mode==="spelling") return startSpelling();
  if(mode==="memory") return startMemory();
  if(mode==="read") return startRead();
}
function buildRounds(unit, n){
  const pool = unit.w;
  const list = shuffle(pool).slice(0, Math.min(n, pool.length));
  return list.map(correct=>({correct}));
}
function distractors(unit, correct, n){
  const others = unit.w.filter(w=>w.e!==correct.e);
  const pick = shuffle(others).slice(0, n-1);
  return shuffle([correct, ...pick]);
}
function startListen(){
  const u=DATA.grades[state.gi].books[state.bi].u[state.ui];
  const rounds=buildRounds(u, 8); let cur=0, correct=0, locked=false;
  function renderRound(){
    locked=false;
    const r=rounds[cur]; const opts=distractors(u, r.correct, 4);
    gameShell(`
      <div class="game-head">
        <div class="progress-pill">${cur+1}/${rounds.length}</div>
        <button class="replay" onclick="speak(decodeURIComponent('${encodeURIComponent(r.correct.e)}'))">🔊</button>
      </div>
      <div class="big-emoji">${r.correct.k}</div>
      <div class="prompt">听一听，选出正确的单词～</div>
      <div class="options">${opts.map(o=>`
        <div class="opt" data-e="${esc(o.e)}" onclick="answerListen(this,'${esc(r.correct.e)}')">
          <div>${o.k}</div><div class="opt-zh">${esc(o.z)}</div>
        </div>`).join("")}</div>
      <div class="feedback" id="fb"></div>
    `, "听音选图");
    setTimeout(()=>speak(r.correct.e), 350);
  }
  window.answerListen=function(el, ans){
    if(locked) return; locked=true;
    const chosen=el.dataset.e; speak(chosen);
    const fb=$("#fb");
    if(chosen===ans){ el.classList.add("correct"); correct++; fb.textContent="✅ 答对啦！"; fb.className="feedback ok"; }
    else{
      el.classList.add("wrong"); fb.textContent="❌ 再听一次～"; fb.className="feedback no";
      $all(".opt").forEach(o=>{ if(o.dataset.e===ans) o.classList.add("correct"); });
    }
    setTimeout(()=>{ cur++; if(cur<rounds.length) renderRound(); else finishGame(correct,rounds.length,"听音选图"); }, 1100);
  };
  renderRound();
}

/* ===================== 3. 单词拼写 ===================== */
function startSpelling(){
  const u=DATA.grades[state.gi].books[state.bi].u[state.ui];
  const spellable = u.w.filter(w=>!w.e.includes(" ")&&w.e.length>=2&&w.e.length<=10);
  const rounds = (spellable.length?spellable:u.w).slice();
  const list = shuffle(rounds).slice(0, Math.min(8, rounds.length));
  let cur=0, correct=0;
  function renderRound(){
    const w=list[cur];
    const letters=shuffle(w.e.split(""));
    gameShell(`
      <div class="game-head">
        <div class="progress-pill">${cur+1}/${list.length}</div>
        <button class="replay" onclick="speak(decodeURIComponent('${encodeURIComponent(w.e)}'))">🔊</button>
      </div>
      <div class="big-emoji">${w.k}</div>
      <div class="prompt">拼出单词：${esc(w.z)}</div>
      <div class="answer-box" id="ans"></div>
      <div class="tiles" id="tiles">${letters.map((c,i)=>`<div class="tile" data-c="${c}" data-i="${i}" onclick="pickLetter(this)">${c}</div>`).join("")}</div>
      <div class="feedback" id="fb"></div>
      <button class="btn ghost" style="margin-top:14px" onclick="resetSpelling()">🔄 清空重拼</button>
    `, "单词拼写");
    setTimeout(()=>speak(w.e), 350);
  }
  window.pickLetter=function(el){
    if(el.classList.contains("used")) return;
    el.classList.add("used");
    const ans=$("#ans"); const span=document.createElement("span");
    span.textContent=el.dataset.c; span.dataset.i=el.dataset.i; ans.appendChild(span);
    const w=list[cur];
    if(ans.children.length===w.e.length){
      const typed=Array.from(ans.children).map(s=>s.textContent).join("");
      const fb=$("#fb");
      if(typed===w.e){ correct++; fb.textContent="✅ 拼对啦！"; fb.className="feedback ok"; speak(w.e); }
      else{ fb.textContent="❌ 再试试"; fb.className="feedback no"; }
      setTimeout(()=>{ if(fb.className.includes("ok")){ cur++; if(cur<list.length) renderRound(); else finishGame(correct,list.length,"单词拼写"); } else { resetSpelling(); } }, 1000);
    }
  };
  window.resetSpelling=function(){
    const ans=$("#ans"); ans.innerHTML="";
    $all("#tiles .tile").forEach(t=>t.classList.remove("used"));
    const fb=$("#fb"); fb.textContent=""; fb.className="feedback";
  };
  renderRound();
}

/* ===================== 4. 翻牌配对 ===================== */
function startMemory(){
  const u=DATA.grades[state.gi].books[state.bi].u[state.ui];
  let words = shuffle(u.w).slice(0, Math.min(6, u.w.length));
  if(words.length<2){ words = shuffle(u.w.concat(u.w)).slice(0,6); }
  let cards=[];
  words.forEach((w,idx)=>{ cards.push({type:"emoji",word:w,key:idx}); cards.push({type:"text",word:w,key:idx}); });
  cards=shuffle(cards);
  let first=null, lock=false, matched=0;
  function renderGrid(){
    gameShell(`
      <div class="game-head"><div class="progress-pill">已配对 ${matched}/${words.length}</div>
      <button class="replay" onclick="speak('Find the matching pair')">🔊</button></div>
      <div class="prompt">翻开两张卡，找出「图—词」好朋友</div>
      <div class="mem-grid" id="mg">${cards.map((c,i)=>`
        <div class="mem-card" data-i="${i}" onclick="flip(${i})">
          <div class="back">❓</div>
          <div class="face">${c.type==="emoji"?c.word.k:esc(c.word.e)}</div>
        </div>`).join("")}</div>
      <div class="feedback" id="fb"></div>
    `, "翻牌配对");
  }
  window.flip=function(i){
    if(lock) return;
    const el=$all("#mg .mem-card")[i]; if(el.classList.contains("flipped")||el.classList.contains("matched")) return;
    el.classList.add("flipped"); const c=cards[i]; speak(c.word.e);
    if(!first){ first={i,c,el}; return; }
    const f=first; const el2=first.el;
    if(f.c.key===c.key && f.c.type!==c.type){ // match
      setTimeout(()=>{ el.classList.add("matched"); el2.classList.add("matched"); matched++;
        const fb=$("#fb"); fb.textContent="✅ 配对成功！"; fb.className="feedback ok";
        first=null; if(matched===words.length) setTimeout(()=>finishGame(matched,words.length,"翻牌配对"),700);
      },450);
    } else {
      lock=true;
      setTimeout(()=>{ el.classList.remove("flipped"); el2.classList.remove("flipped"); first=null; lock=false; }, 900);
    }
  };
  renderGrid();
}

/* ===================== 5. 跟读打分 ===================== */
function startRead(){
  const u=DATA.grades[state.gi].books[state.bi].u[state.ui];
  const list = shuffle(u.w).slice(0, Math.min(8, u.w.length));
  let cur=0, total=0, sumScore=0, done=false;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function renderRound(){
    const w=list[cur];
    gameShell(`
      <div class="game-head"><div class="progress-pill">${cur+1}/${list.length}</div>
      <button class="replay" onclick="speak(decodeURIComponent('${encodeURIComponent(w.e)}'))">🔊</button></div>
      <div class="big-emoji">${w.k}</div>
      <div class="big-word">${esc(w.e)}</div>
      <div class="prompt">${esc(w.z)} · 先听示范，再跟我读</div>
      <button class="mic-btn" id="mic" onclick="startRec()">🎤</button>
      <div class="read-score" id="score"></div>
      <div class="read-hint" id="hint">点麦克风开始跟读</div>
      ${SR?`<button class="btn ghost" style="margin-top:10px" onclick="nextRead()">跳过 ➡️</button>`
          :`<div class="row"><button class="btn green" onclick="manualPass()">✅ 我读啦，过关</button></div>`}
    `, "跟读打分");
    setTimeout(()=>speak(w.e), 350);
  }
  window.startRec=function(){
    if(!SR){ toast("当前浏览器不支持语音识别"); return; }
    const mic=$("#mic"); mic.classList.add("listening"); $("#hint").textContent="正在聆听…大声读出来吧！";
    const rec=new SR(); rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=1;
    rec.onresult=e=>{ const txt=e.results[0][0].transcript; finishRec(txt); };
    rec.onerror=()=>{ mic.classList.remove("listening"); $("#hint").textContent="没听清，再试一次～"; };
    rec.onend=()=>{ mic.classList.remove("listening"); };
    try{ rec.start(); }catch(err){ mic.classList.remove("listening"); }
  };
  function finishRec(txt){
    const w=list[cur]; const sc=scoreRead(w.e, txt);
    $("#score").textContent=sc+"分"; $("#score").style.color = sc>=80?"#3fc26b":sc>=50?"#ffd166":"#ff6f91";
    $("#hint").textContent= txt? `你说的是：“${txt}”` : "没听清";
    total++; sumScore+=sc; done=true;
    setTimeout(nextRead, 1200);
  }
  window.manualPass=function(){ total++; sumScore+=100; done=true; nextRead(); };
  function scoreRead(target, transcript){
    if(!transcript) return 0;
    const t=target.toLowerCase().replace(/[^a-z]/g,"");
    const h=transcript.toLowerCase().replace(/[^a-z]/g,"");
    if(!h) return 0;
    if(h.includes(t)||t.includes(h)) return 100;
    return Math.round((1-lev(t,h)/Math.max(t.length,h.length))*100);
  }
  function lev(a,b){
    const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
    for(let j=0;j<=n;j++) d[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return d[m][n];
  }
  window.nextRead=function(){
    cur++;
    if(cur<list.length){ done=false; renderRound(); }
    else{ const avg=total?Math.round(sumScore/total):0; const earned=avg>=80?3:avg>=50?2:total>0?1:0; finishGame(earned,1,"跟读打分"); }
  };
  renderRound();
}

/* ===================== 设置 & 导航 ===================== */
function openSettings(){ $("#settingsModal").classList.remove("hidden"); syncSettings(); }
function closeSettings(){ $("#settingsModal").classList.add("hidden"); }
function syncSettings(){
  $("#ttsSwitch").classList.toggle("on", settings.tts);
  $("#rateRange").value=settings.rate;
}
$("#ttsSwitch").addEventListener("click",()=>{ settings.tts=!settings.tts; saveSettings(); $("#ttsSwitch").classList.toggle("on",settings.tts); });
$("#rateRange").addEventListener("input",e=>{ settings.rate=parseFloat(e.target.value); saveSettings(); });
function goBack(){
  if(state.view==="grades"){ state.view="home"; render(); }
  else if(state.view==="units"){ state.view="grades"; render(); }
  else if(state.view==="modes"){ state.view="units"; render(); }
  else if(state.view==="game"||state.mode){ state.view="modes"; render(); }
  else render();
}

/* 首次交互解锁音频 */
function unlockAudio(){ if('speechSynthesis' in window){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} } document.removeEventListener('pointerdown',unlockAudio); }
document.addEventListener('pointerdown',unlockAudio);

render();
</script>
</body>
</html>
